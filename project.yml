name: LockVocab
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # ← 自分のTeam IDを入れる(XcodeのSigningで選んでもOK)
    CODE_SIGN_STYLE: Automatic
targets:
  LockVocab:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: LockVocabWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lockvocab   # ← 自分用に変更
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LockVocab
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/LockVocab.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.lockvocab]   # ← AppGroup.id と一致させる
  LockVocabWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lockvocab.widget   # ← アプリ本体のID + .widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: LockVocab Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/LockVocabWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.lockvocab]
