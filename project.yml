name: LockVocab
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  LockVocab:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - LockVocabApp.swift
          - WordStore.swift
          - ContentView.swift
          - WordEditView.swift
          - SettingsView.swift
          - AppGroup.swift
          - Models.swift
          - SharedStore.swift
          - WordPicker.swift
          - SeedWords.swift
    dependencies:
      - target: LockVocabWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lockvocab
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: LockVocab
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Generated/LockVocab.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.lockvocab]
  LockVocabWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: .
        includes:
          - VocabWidget.swift
          - AppGroup.swift
          - Models.swift
          - SharedStore.swift
          - WordPicker.swift
          - SeedWords.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lockvocab.widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: LockVocab Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/LockVocabWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.lockvocab]
